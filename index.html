<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="input-container">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input type="number" name="" id="" class="input input-text" data-js="input">
            <button class="btn btn-text" data-js="convert">Convert</button>
        </div>
        <div class="results-container" data-js="results-container">
            <div class="result" data-js="results">
                <h2 class="result-description">Length (Meter/Feet)</h2>
                <p class="result-text" data-js="length">1 meter = 65.616 feet | 1 feet = 6.096 meters</p>
            </div>
             <div class="result">
                <h2 class="result-description">Volume (Liters/Gallons)</h2>
                <p class="result-text" data-js="volume">1 liter = 5.284 gallons | 1 gallon = 75.708 liters</p>
            </div>
             <div class="result">
                <h2 class="result-description">Mass (Kilograms/Pounds)</h2>
                <p class="result-text" data-js="mass">1 kilo = 44.092 pounds | 1 pound = 9.072 kilos</p>
            </div>
<!-- checking pull request -->
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
